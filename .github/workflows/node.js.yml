name: Node.js CI

on:
  push:
    branches: [ "production", "staging", "feature/workflow" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo apt-get update && sudo apt-get install -y docker-compose

    - name: Build and Start Docker Compose Services
      run: |
        docker-compose -f docker-compose_test.yml up --build -d

    - name: Wait for App to be Ready
      run: |
        for i in {1..10}; do
          curl -s http://localhost:3001 && break || sleep 5
        done

    - name: Run Cypress Tests
      run: |
        docker exec <test_container_name> cypress run

    - name: Stop and Clean Up Docker Services
      if: always()
      run: |
        docker-compose -f docker-compose_test.yml down -v
